<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万剑归宗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #0a0a0f;
    cursor: none;
    font-family: 'Microsoft YaHei', sans-serif;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }

  .panel {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    background: rgba(40, 15, 60, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 74, 255, 0.25);
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 220px;
    transition: opacity 0.3s;
  }

  .panel h3 {
    color: #d8a0ff;
    font-size: 14px;
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 4px;
  }

  .panel label {
    display: block;
    color: rgba(210, 170, 255, 0.8);
    font-size: 12px;
    margin-bottom: 4px;
    margin-top: 12px;
  }

  .panel label:first-of-type { margin-top: 0; }

  .panel input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(180, 74, 255, 0.2);
    border-radius: 2px;
    outline: none;
  }

  .panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #b44aff;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(180, 74, 255, 0.6);
  }

  .hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(210, 170, 255, 0.5);
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 10;
    pointer-events: none;
    transition: opacity 2s ease-out;
  }

  .hint.fade { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="panel">
  <h3>剑阵控制</h3>
  <label>剑的数量: <span id="vCount">40</span></label>
  <input type="range" id="sCount" min="10" max="100" value="40">
  <label>旋转速度: <span id="vSpeed">1.0</span></label>
  <input type="range" id="sSpeed" min="1" max="30" value="10">
  <label>拖尾长度: <span id="vTrail">20</span></label>
  <input type="range" id="sTrail" min="5" max="50" value="20">
  <label>爆发力度: <span id="vBurst">5</span></label>
  <input type="range" id="sBurst" min="1" max="10" value="5">
</div>

<div class="hint" id="hint">移动鼠标控制剑阵 · 点击触发万剑归宗</div>

<script>
// ─── Config ───
const config = {
  swordCount: 40,
  rotateSpeed: 1.0,
  trailLife: 20,
  burstPower: 5
};

// ─── Canvas Setup ───
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Mouse ───
const mouse = { x: canvas.width / 2, y: canvas.height / 2, active: false };

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => { mouse.active = false; });

// ─── Panel interaction ───
let panelHover = false;
const panel = document.getElementById('panel');
panel.addEventListener('mouseenter', () => { panelHover = true; });
panel.addEventListener('mouseleave', () => { panelHover = false; });

// Sliders
document.getElementById('sCount').addEventListener('input', e => {
  config.swordCount = +e.target.value;
  document.getElementById('vCount').textContent = config.swordCount;
  rebuildSwords();
});
document.getElementById('sSpeed').addEventListener('input', e => {
  config.rotateSpeed = +e.target.value / 10;
  document.getElementById('vSpeed').textContent = config.rotateSpeed.toFixed(1);
});
document.getElementById('sTrail').addEventListener('input', e => {
  config.trailLife = +e.target.value;
  document.getElementById('vTrail').textContent = config.trailLife;
});
document.getElementById('sBurst').addEventListener('input', e => {
  config.burstPower = +e.target.value;
  document.getElementById('vBurst').textContent = config.burstPower;
});

// Hint fade
setTimeout(() => { document.getElementById('hint').classList.add('fade'); }, 3000);

// ─── Color Helpers ───
function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

// ─── Sword ───
class Sword {
  constructor(index, total) {
    this.index = index;
    this.layer = Math.floor(Math.random() * 3); // 0,1,2
    this.orbitRadius = 60 + this.layer * 55 + Math.random() * 30;
    this.phase = (index / total) * Math.PI * 2 + Math.random() * 0.3;
    this.layerSpeed = 1 + (2 - this.layer) * 0.4; // inner faster

    this.x = mouse.x + this.orbitRadius * Math.cos(this.phase);
    this.y = mouse.y + this.orbitRadius * Math.sin(this.phase);
    this.vx = 0;
    this.vy = 0;
    this.angle = this.phase;
    this.length = 18 + this.layer * 6 + Math.random() * 8;

    this.burstVx = 0;
    this.burstVy = 0;
    this.burstDecay = 0;
  }
}

let swords = [];
function rebuildSwords() {
  const target = config.swordCount;
  // Add or remove swords
  while (swords.length < target) {
    swords.push(new Sword(swords.length, target));
  }
  while (swords.length > target) {
    swords.pop();
  }
  // Redistribute phases
  swords.forEach((s, i) => {
    s.phase = (i / swords.length) * Math.PI * 2 + Math.random() * 0.3;
  });
}
rebuildSwords();

// ─── Particles ───
class Particle {
  constructor(x, y, vx, vy, life, size, color) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.size = size; this.color = color;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.97;
    this.vy *= 0.97;
    this.life--;
    return this.life > 0;
  }

  draw(ctx) {
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t * 0.8;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * t, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];

function emitTrail(sword) {
  const speed = Math.sqrt(sword.vx * sword.vx + sword.vy * sword.vy);
  const count = speed > 3 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const spread = 0.5;
    particles.push(new Particle(
      sword.x + (Math.random() - 0.5) * spread * 4,
      sword.y + (Math.random() - 0.5) * spread * 4,
      (Math.random() - 0.5) * 0.5,
      (Math.random() - 0.5) * 0.5,
      config.trailLife + Math.random() * 5,
      1.5 + Math.random() * 2,
      lerpColor('#b44aff', '#4a0080', Math.random())
    ));
  }
}

// ─── Burst ───
let burstPhase = 0; // 0=none, 1=gathering, 2=exploding
let burstTimer = 0;
const burstTarget = { x: 0, y: 0 };

canvas.addEventListener('click', e => {
  if (panelHover) return;
  burstTarget.x = e.clientX;
  burstTarget.y = e.clientY;
  burstPhase = 1;
  burstTimer = 0;
});

function triggerExplosion() {
  const power = config.burstPower * 20;
  for (const s of swords) {
    const dx = s.x - burstTarget.x;
    const dy = s.y - burstTarget.y;
    const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
    s.burstVx = (dx / dist) * power * (0.7 + Math.random() * 0.6);
    s.burstVy = (dy / dist) * power * (0.7 + Math.random() * 0.6);
    s.burstDecay = 0.92;
  }

  // Explosion particles
  for (let i = 0; i < 150; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push(new Particle(
      burstTarget.x, burstTarget.y,
      Math.cos(angle) * speed, Math.sin(angle) * speed,
      15 + Math.random() * 20,
      2 + Math.random() * 4,
      Math.random() > 0.3 ? lerpColor('#b44aff', '#e0b0ff', Math.random()) : '#e0b0ff'
    ));
  }
}

// ─── Lightning ───
function drawLightning(x1, y1, x2, y2, color, width) {
  const segments = 4 + Math.floor(Math.random() * 3);
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 10) return;

  const nx = -dy / len, ny = dx / len;
  ctx.beginPath();
  ctx.moveTo(x1, y1);

  for (let i = 1; i < segments; i++) {
    const t = i / segments;
    const offset = (Math.random() - 0.5) * len * 0.2;
    ctx.lineTo(
      x1 + dx * t + nx * offset,
      y1 + dy * t + ny * offset
    );
  }
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = 0.3 + Math.random() * 0.4;
  ctx.stroke();
}

// ─── Crosshair ───
function drawCrosshair(time) {
  const pulse = 0.6 + Math.sin(time * 3) * 0.2;
  const r = 8 + Math.sin(time * 2) * 2;

  // Outer glow
  const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, r * 3);
  grad.addColorStop(0, `rgba(180, 74, 255, ${0.15 * pulse})`);
  grad.addColorStop(1, 'rgba(180, 74, 255, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, r * 3, 0, Math.PI * 2);
  ctx.fill();

  // Crosshair lines
  ctx.globalAlpha = 0.5 * pulse;
  ctx.strokeStyle = '#e0b0ff';
  ctx.lineWidth = 1;
  const gap = 4;
  const arm = 10;
  ctx.beginPath();
  ctx.moveTo(mouse.x - arm, mouse.y); ctx.lineTo(mouse.x - gap, mouse.y);
  ctx.moveTo(mouse.x + gap, mouse.y); ctx.lineTo(mouse.x + arm, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - arm); ctx.lineTo(mouse.x, mouse.y - gap);
  ctx.moveTo(mouse.x, mouse.y + gap); ctx.lineTo(mouse.x, mouse.y + arm);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ─── Main Loop ───
let time = 0;

function update() {
  time += 0.016;

  // Burst logic
  if (burstPhase === 1) {
    burstTimer++;
    if (burstTimer > 12) {
      burstPhase = 2;
      burstTimer = 0;
      triggerExplosion();
    }
  } else if (burstPhase === 2) {
    burstTimer++;
    if (burstTimer > 30) {
      burstPhase = 0;
    }
  }

  // Update swords
  for (const s of swords) {
    // Compute target on orbit
    const speed = config.rotateSpeed * s.layerSpeed;
    const currentPhase = s.phase + time * speed;

    let tx, ty;
    if (burstPhase === 1) {
      // Gather to burst target
      tx = burstTarget.x;
      ty = burstTarget.y;
    } else {
      tx = mouse.x + s.orbitRadius * Math.cos(currentPhase);
      ty = mouse.y + s.orbitRadius * Math.sin(currentPhase);
    }

    // Spring physics
    const stiffness = burstPhase === 1 ? 0.25 : 0.04;
    const damping = 0.82;

    const ax = (tx - s.x) * stiffness;
    const ay = (ty - s.y) * stiffness;

    s.vx = (s.vx + ax) * damping;
    s.vy = (s.vy + ay) * damping;

    // Burst impulse
    if (s.burstVx || s.burstVy) {
      s.vx += s.burstVx;
      s.vy += s.burstVy;
      s.burstVx *= s.burstDecay;
      s.burstVy *= s.burstDecay;
      if (Math.abs(s.burstVx) < 0.1) s.burstVx = 0;
      if (Math.abs(s.burstVy) < 0.1) s.burstVy = 0;
    }

    s.x += s.vx;
    s.y += s.vy;

    // Angle follows velocity
    if (Math.abs(s.vx) > 0.5 || Math.abs(s.vy) > 0.5) {
      const targetAngle = Math.atan2(s.vy, s.vx);
      let diff = targetAngle - s.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      s.angle += diff * 0.15;
    } else {
      const targetAngle = Math.atan2(s.y - mouse.y, s.x - mouse.x);
      let diff = targetAngle - s.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      s.angle += diff * 0.08;
    }

    // Emit trail
    emitTrail(s);
  }

  // Update particles
  particles = particles.filter(p => p.update());
}

function draw() {
  // Semi-transparent clear for motion trail
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(10, 10, 15, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background radial glow at mouse
  const bgGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 300);
  bgGrad.addColorStop(0, 'rgba(74, 0, 128, 0.05)');
  bgGrad.addColorStop(1, 'rgba(10, 10, 15, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Particles (additive)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    p.draw(ctx);
  }

  // Lightning
  for (const s of swords) {
    if (Math.random() < 0.04) {
      drawLightning(s.x, s.y, mouse.x, mouse.y, '#e0b0ff', 0.8);
    }
  }

  // Swords
  for (const s of swords) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);

    // Sword glow
    ctx.globalAlpha = 0.3;
    ctx.shadowColor = '#b44aff';
    ctx.shadowBlur = 15;
    ctx.strokeStyle = '#8b2fc9';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-s.length * 0.3, 0);
    ctx.lineTo(s.length * 0.7, 0);
    ctx.stroke();

    // Sword core
    ctx.globalAlpha = 0.9;
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#e0b0ff';
    ctx.strokeStyle = '#e0b0ff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-s.length * 0.3, 0);
    ctx.lineTo(s.length * 0.7, 0);
    ctx.stroke();

    // Tip sparkle
    ctx.globalAlpha = 0.7 + Math.sin(time * 10 + s.phase) * 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.length * 0.7, 0, 1.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // Burst flash
  if (burstPhase === 2 && burstTimer < 5) {
    const flashAlpha = (1 - burstTimer / 5) * 0.3;
    const flashGrad = ctx.createRadialGradient(burstTarget.x, burstTarget.y, 0, burstTarget.x, burstTarget.y, 200);
    flashGrad.addColorStop(0, `rgba(224, 176, 255, ${flashAlpha})`);
    flashGrad.addColorStop(1, 'rgba(180, 74, 255, 0)');
    ctx.fillStyle = flashGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Crosshair
  if (mouse.active) {
    drawCrosshair(time);
  }

  ctx.globalAlpha = 1;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
